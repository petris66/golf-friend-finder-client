<!doctype html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Friend Finder</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

</head>
<body>
<main class="container">
<h1>Golf Friend Finder</h1>

<label>Pelaajat</label>
<input id="player" type="text" placeholder="Esim. Markku, Matti, Pekka">

<label>Haku</label>
<select id="days">
  <option value="1">Tänään</option>
  <option value="7" selected>Seuraavat 7 päivää</option>
</select>

<h2>Kentät</h2>
<div class="course-actions">
<button id="selectAll">Valitse kaikki</button>
<button id="clearAll">Tyhjennä</button>
</div>

<div id="courses" class="courses"></div>

<button id="search">Hae varaukset</button>

<div id="results" class="results">Ei vielä hakua.</div>
</main>

<script src="app.js"></script>
</body>
</html>
